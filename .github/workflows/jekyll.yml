name: Validate generated site temporarily

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify publication rendering
        run: |
          test -f _site/publications/index.html
          for t in \
            "SynLogic: Synthesizing Verifiable Reasoning Data at Scale" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts" \
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations"; do
            grep -F "$t" _site/publications/index.html || { echo "Missing from publications: $t"; exit 1; }
            grep -F "$t" _site/index.html || { echo "Missing from about/home: $t"; exit 1; }
          done
          grep -F "jliugi@connect.ust.hk" _site/index.html
          grep -F "Vicent0205" _site/index.html
          grep -F "junteng88716710" _site/index.html
